name: Java 21 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests without database credentials
        run: bash ./mvnw --batch-mode test
      - name: Check source for common credential patterns
        run: python3 scripts/check-source.py
      - name: Build deployment image without runtime secrets
        run: docker build --tag mdm:ci .
