# Activate together with prod: SPRING_PROFILES_ACTIVE=prod,render
spring.config.import=optional:configtree:/etc/secrets/
server.address=0.0.0.0
server.port=${PORT:10000}
mdm.site.base-url=${SITE_BASE_URL:${RENDER_EXTERNAL_URL:}}
# Hikari also uses this budget for the driver's login deadline. Allow cold-start TLS/authentication.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.data-source-properties.connectTimeout=15000
spring.datasource.hikari.data-source-properties.socketTimeout=60000
