spring.config.import=optional:configtree:/run/secrets/
spring.datasource.url=jdbc:mysql://db:3306/mdm?sslMode=REQUIRED&allowPublicKeyRetrieval=false
spring.datasource.username=mdm_app
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.password=${db.password}
spring.sql.init.mode=never
spring.thymeleaf.cache=true
spring.servlet.multipart.enabled=false
spring.mvc.log-request-details=false
debug=false
trace=false
logging.level.root=INFO
logging.level.org.springframework.security=WARN
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=20m
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.max-http-request-header-size=16KB
server.tomcat.threads.max=100
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10s
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
spring.web.resources.cache.cachecontrol.max-age=1h
mdm.security.production=true
mdm.security.rate-secret=${rate.secret}
mdm.demo.enabled=false
