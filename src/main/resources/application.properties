
spring.application.name=mdm
spring.config.import=optional:configtree:./.smtp-secret/
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/opsflow}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.thymeleaf.cache=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.error.include-message=never
server.servlet.session.timeout=30m
mdm.demo.enabled=${MDM_DEMO:false}

mdm.site.base-url=${SITE_BASE_URL:http://localhost:8080}
mdm.legal.operator=${LEGAL_OPERATOR:Your workspace operator}
mdm.legal.contact=${LEGAL_CONTACT:}
mdm.analytics.enabled=${ANALYTICS_ENABLED:false}
spring.servlet.multipart.enabled=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=MDMSESSION
server.servlet.session.cookie.same-site=lax

# Password recovery is disabled until an SMTP provider is configured.
mdm.password-reset.email-enabled=${MDM_RESET_EMAIL_ENABLED:false}
mdm.password-reset.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:${smtp.password:}}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
